name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    name: Source audit, Go race and loopback STCP
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Source, permissions and history audit
        run: python3 scripts/audit_release.py
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.3'
          cache-dependency-path: go/go.sum
      - name: Download locked module graph
        working-directory: go
        run: go mod download all
      - name: Race regression
        working-directory: go
        env:
          GOPROXY: 'off'
          GOTOOLCHAIN: local
        run: go test -race ./frpclib -count=1 -v
      - name: Loopback STCP integration
        run: ./tests/run-e2e.sh

  ios:
    name: Swift regressions and unsigned iOS build
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.3'
          cache-dependency-path: go/go.sum
      - name: Live Activity policy regression
        run: ./tests/run-activity-tests.sh
      - name: Controller regression
        run: ./tests/run-controller-tests.sh
      - name: Chat regression
        run: ./tests/run-chat-tests.sh
      - name: HTTPS update fixtures
        run: ./tests/run-update-tests.sh
      - name: Unsigned iPhoneOS build
        run: ./build.sh --unsigned
      - name: Built IPA defaults, versions, payload and path audit
        run: python3 tests/audit-ipa-defaults.py build/FrpClient-unsigned.ipa
